<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Enter your credentials to access your account</p>

    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="credentials.email" placeholder="name@example.com" required
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" #email="ngModel"
          [class.error]="email.invalid && email.touched">
        <div *ngIf="email.invalid && email.touched" class="field-error">
          <span *ngIf="email.errors?.['required']">Email is required</span>
          <span *ngIf="email.errors?.['pattern']">Please enter a valid email address (e.g., .com, .co)</span>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="credentials.password"
            placeholder="••••••••" required #password="ngModel" [class.error]="password.invalid && password.touched">
          <button type="button" class="password-toggle" (click)="showPassword = !showPassword" tabindex="-1">
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div *ngIf="password.invalid && password.touched" class="field-error">
          Password is required
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="!loginForm.valid || loading">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/signup">Sign up</a>
    </p>
  </div>
</div>
