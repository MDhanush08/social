<div class="sidebar-overlay" *ngIf="uiService.isSidebarOpen()" (click)="uiService.closeSidebar()"></div>

<div class="sidebar" [class.open]="uiService.isSidebarOpen()" *ngIf="authService.isLoggedIn()">
  <div class="sidebar-header">
    <div class="user-badge">
      <div class="avatar">
        {{ authService.currentUser()?.username?.charAt(0) || 'U' }}
      </div>
      <div class="user-details">
        <span class="username">{{ authService.currentUser()?.username }}</span>
        <span class="status">Online</span>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item"
      (click)="uiService.closeSidebar()">
      <span class="icon">🏠</span>
      <span class="label">Home</span>
    </a>
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="uiService.closeSidebar()">
      <span class="icon">📊</span>
      <span class="label">Dashboard</span>
    </a>
    <div class="nav-section">Social Hub</div>
    <a class="nav-item">
      <span class="icon">📷</span>
      <span class="label">Instagram</span>
    </a>
    <a class="nav-item">
      <span class="icon">📘</span>
      <span class="label">Facebook</span>
    </a>
    <a class="nav-item">
      <span class="icon">🐦</span>
      <span class="label">Twitter</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button (click)="authService.logout(); uiService.closeSidebar()" class="btn-logout">
      <span class="icon">🚪</span>
      <span class="label">Logout</span>
    </button>
  </div>
</div>
