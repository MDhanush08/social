<div class="sidebar-overlay fixed inset-0 bg-black/70 backdrop-blur-sm z-[60] md:hidden"
  *ngIf="uiService.isSidebarOpen()" (click)="uiService.closeSidebar()"></div>

<aside
  class="fixed left-0 top-0 h-full bg-[#0f172a] border-r border-white/5 z-[70] transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] shadow-2xl flex flex-col md:translate-x-0 will-change-[width,transform] overflow-hidden"
  [class.w-72]="!uiService.isSidebarCollapsed()" [class.w-20]="uiService.isSidebarCollapsed()"
  [class.-translate-x-full]="!uiService.isSidebarOpen()"
  [class.translate-x-0]="uiService.isSidebarOpen() || isDesktop()" *ngIf="authService.isLoggedIn()">

  <!-- Sidebar Navigation Container -->
  <div class="h-16 flex items-center px-6 transition-all duration-300"
    [class.justify-center]="uiService.isSidebarCollapsed()" [class.justify-start]="!uiService.isSidebarCollapsed()">
    <!-- Branding removed here to follow "One Logo" in Navbar philosophy -->
    <div *ngIf="uiService.isSidebarCollapsed()"
      class="text-xl text-purple-400 group-hover:scale-110 transition-transform">✨</div>
    <span *ngIf="!uiService.isSidebarCollapsed()"
      class="text-xs font-black uppercase tracking-widest text-slate-500">Workspace</span>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-3 space-y-2 mt-4 overflow-y-auto overflow-x-hidden custom-scrollbar">
    <!-- AI Assistant Hub -->
    <a routerLink="/chat" routerLinkActive="active-link"
      class="nav-item group flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-slate-400 hover:text-white overflow-hidden shrink-0"
      [class.justify-center]="uiService.isSidebarCollapsed()" (click)="uiService.closeSidebar()"
      [title]="uiService.isSidebarCollapsed() ? 'Open AI Chat Hub' : ''">
      <span
        class="text-xl opacity-70 group-hover:opacity-100 transition-all flex items-center justify-center shrink-0 w-8">💬</span>
      <span class="font-bold text-sm transition-all duration-300 whitespace-nowrap overflow-hidden"
        [class.w-0]="uiService.isSidebarCollapsed()" [class.opacity-0]="uiService.isSidebarCollapsed()">AI
        Assistant</span>
    </a>

    <!-- Performance Dashboard -->
    <a routerLink="/dashboard" routerLinkActive="active-link"
      class="nav-item group flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-slate-400 hover:text-white overflow-hidden shrink-0"
      [class.justify-center]="uiService.isSidebarCollapsed()" (click)="uiService.closeSidebar()"
      [title]="uiService.isSidebarCollapsed() ? 'Analytics & Metrics' : ''">
      <span
        class="text-xl opacity-70 group-hover:opacity-100 transition-all flex items-center justify-center shrink-0 w-8">📊</span>
      <span class="font-bold text-sm transition-all duration-300 whitespace-nowrap overflow-hidden"
        [class.w-0]="uiService.isSidebarCollapsed()" [class.opacity-0]="uiService.isSidebarCollapsed()">Analytics</span>
    </a>

    <!-- Divider -->
    <div class="my-4 border-t border-white/5 mx-2" [class.opacity-0]="uiService.isSidebarCollapsed()"></div>

    <!-- Ecosystem Placeholder -->
    <a class="nav-item group flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-slate-600 hover:text-white cursor-not-allowed overflow-hidden shrink-0"
      [class.justify-center]="uiService.isSidebarCollapsed()"
      [title]="uiService.isSidebarCollapsed() ? 'Explore Social Ecosystem' : ''">
      <span
        class="text-xl opacity-30 group-hover:opacity-50 transition-all flex items-center justify-center shrink-0 w-8">🌐</span>
      <span class="font-bold text-sm transition-all duration-300 whitespace-nowrap overflow-hidden"
        [class.w-0]="uiService.isSidebarCollapsed()" [class.opacity-0]="uiService.isSidebarCollapsed()">Explore</span>
    </a>
  </nav>

  <!-- Footer -->
  <div class="p-4 border-t border-white/5 bg-slate-900/40">
    <div class="flex items-center gap-3 px-2 overflow-hidden transition-all duration-300 mb-4"
      [class.justify-center]="uiService.isSidebarCollapsed()">
      <div
        class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-xs font-bold text-slate-400 border border-white/5 shrink-0">
        {{ authService.currentUser()?.username?.charAt(0) || 'U' }}
      </div>
      <div class="truncate transition-all duration-300" [class.w-0]="uiService.isSidebarCollapsed()"
        [class.opacity-0]="uiService.isSidebarCollapsed()">
        <p class="text-[11px] font-bold text-white truncate">{{ authService.currentUser()?.username }}</p>
      </div>
    </div>

    <button (click)="authService.logout()"
      class="w-full flex items-center justify-center gap-3 p-3 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all text-sm font-bold border border-red-500/10"
      [title]="uiService.isSidebarCollapsed() ? 'Logout' : ''">
      <span class="text-base shrink-0">🚪</span>
      <span class="transition-all duration-300 whitespace-nowrap overflow-hidden text-xs uppercase tracking-tighter"
        [class.w-0]="uiService.isSidebarCollapsed()" [class.opacity-0]="uiService.isSidebarCollapsed()">Logout</span>
    </button>
  </div>
</aside>
