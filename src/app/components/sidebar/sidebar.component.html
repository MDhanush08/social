<div class="sidebar-overlay fixed inset-0 bg-black/70 backdrop-blur-sm z-[60] md:hidden"
  *ngIf="uiService.isSidebarOpen()" (click)="uiService.closeSidebar()"></div>

<aside
  class="fixed left-0 top-0 h-full bg-[#0f172a] border-r border-white/5 z-[70] transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] shadow-2xl flex flex-col md:translate-x-0 will-change-[width,transform] overflow-hidden"
  [class.w-72]="!isEffectivelyCollapsed" [class.w-20]="isEffectivelyCollapsed"
  [class.-translate-x-full]="!uiService.isSidebarOpen()"
  [class.translate-x-0]="uiService.isSidebarOpen() || isDesktop()" *ngIf="authService.isLoggedIn()">

  <!-- Sidebar Header with Toggle -->
  <div class="h-16 flex items-center px-4 transition-all duration-300 border-b border-white/5 gap-3">
    <!-- The Toggle Button -->
    <button
      class="relative group/toggle flex items-center justify-center p-2 rounded-xl bg-white/5 border border-white/10 hover:border-purple-500/40 hover:bg-purple-500/10 transition-all duration-300 active:scale-90 shrink-0"
      (click)="toggleSidebar()" [title]="uiService.isSidebarCollapsed() ? 'Expand' : 'Collapse'">

      <div class="relative w-5 h-5 flex items-center justify-center transition-all duration-500"
        [class.rotate-180]="isEffectivelyCollapsed">
        <div class="flex flex-col gap-1.5 items-start">
          <div class="h-[2px] bg-slate-400 group-hover/toggle:bg-purple-400 rounded-full transition-all duration-300"
            [class.w-4]="!isEffectivelyCollapsed" [class.w-2]="isEffectivelyCollapsed"></div>
          <div class="h-[2px] bg-white group-hover/toggle:bg-white rounded-full transition-all duration-300 w-5"></div>
          <div class="h-[2px] bg-slate-500 group-hover/toggle:bg-blue-400 rounded-full transition-all duration-300"
            [class.w-3]="!isEffectivelyCollapsed" [class.w-5]="isEffectivelyCollapsed"></div>
        </div>
      </div>
    </button>

    <div class="flex items-center gap-2 overflow-hidden transition-all duration-300" *ngIf="!isEffectivelyCollapsed">
      <div
        class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-blue-600 flex items-center justify-center text-sm shadow-lg shrink-0">
        ✨</div>
      <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 truncate">Workspace</span>
    </div>
  </div>


  <!-- Navigation -->
  <nav class="flex-1 p-3 space-y-2 mt-4 overflow-y-auto overflow-x-hidden custom-scrollbar">
    <!-- AI Assistant Hub -->
    <a routerLink="/chat" routerLinkActive="active-link"
      class="nav-item group flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-slate-400 hover:text-white overflow-hidden shrink-0"
      [class.justify-center]="isEffectivelyCollapsed" (click)="uiService.closeSidebar()"
      [title]="isEffectivelyCollapsed ? 'Open AI Chat Hub' : ''">
      <span
        class="text-xl opacity-70 group-hover:opacity-100 transition-all flex items-center justify-center shrink-0 w-8">💬</span>
      <span class="font-bold text-sm transition-all duration-300 whitespace-nowrap overflow-hidden"
        [class.w-0]="isEffectivelyCollapsed" [class.opacity-0]="isEffectivelyCollapsed">AI
        Assistant</span>
    </a>

    <!-- Performance Dashboard -->
    <a routerLink="/dashboard" routerLinkActive="active-link"
      class="nav-item group flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-slate-400 hover:text-white overflow-hidden shrink-0"
      [class.justify-center]="isEffectivelyCollapsed" (click)="uiService.closeSidebar()"
      [title]="isEffectivelyCollapsed ? 'Analytics & Metrics' : ''">
      <span
        class="text-xl opacity-70 group-hover:opacity-100 transition-all flex items-center justify-center shrink-0 w-8">📊</span>
      <span class="font-bold text-sm transition-all duration-300 whitespace-nowrap overflow-hidden"
        [class.w-0]="isEffectivelyCollapsed" [class.opacity-0]="isEffectivelyCollapsed">Analytics</span>
    </a>

    <!-- Divider -->
    <div class="my-4 border-t border-white/5 mx-2" [class.opacity-0]="isEffectivelyCollapsed"></div>

    <!-- Ecosystem Placeholder -->
    <a class="nav-item group flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition-all text-slate-600 hover:text-white cursor-not-allowed overflow-hidden shrink-0"
      [class.justify-center]="isEffectivelyCollapsed"
      [title]="isEffectivelyCollapsed ? 'Explore Social Ecosystem' : ''">
      <span
        class="text-xl opacity-30 group-hover:opacity-50 transition-all flex items-center justify-center shrink-0 w-8">🌐</span>
      <span class="font-bold text-sm transition-all duration-300 whitespace-nowrap overflow-hidden"
        [class.w-0]="isEffectivelyCollapsed" [class.opacity-0]="isEffectivelyCollapsed">Explore</span>
    </a>
  </nav>

  <!-- Footer -->
  <div class="p-4 border-t border-white/5 bg-slate-900/40">
    <div class="flex items-center gap-3 px-2 overflow-hidden transition-all duration-300 mb-4"
      [class.justify-center]="isEffectivelyCollapsed">
      <div
        class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-xs font-bold text-slate-400 border border-white/5 shrink-0">
        {{ authService.currentUser()?.username?.charAt(0) || 'U' }}
      </div>
      <div class="truncate transition-all duration-300" [class.w-0]="isEffectivelyCollapsed"
        [class.opacity-0]="isEffectivelyCollapsed">
        <p class="text-[11px] font-bold text-white truncate">{{ authService.currentUser()?.username }}</p>
      </div>
    </div>

    <button (click)="logout()"
      class="w-full flex items-center justify-center gap-3 p-3 rounded-xl bg-red-500/5 text-red-400 hover:bg-red-500 hover:text-white transition-all duration-300 text-[10px] font-black uppercase tracking-widest border border-red-500/10 group"
      [title]="isEffectivelyCollapsed ? 'Logout' : ''">
      <div class="relative w-5 h-5 flex items-center justify-center shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 transition-transform duration-300 group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </div>
      <span class="transition-all duration-300 whitespace-nowrap overflow-hidden" [class.w-0]="isEffectivelyCollapsed"
        [class.opacity-0]="isEffectivelyCollapsed">Sign Out</span>
    </button>
  </div>
</aside>
