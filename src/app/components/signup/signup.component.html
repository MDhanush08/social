<div class="min-h-[calc(100vh-64px)] flex items-center justify-center p-6 bg-[#0f172a] relative overflow-hidden">
  <!-- Background Decor -->
  <div class="absolute top-[20%] right-[10%] w-[35%] h-[35%] bg-purple-600/10 rounded-full blur-[90px]"></div>
  <div class="absolute bottom-[20%] left-[10%] w-[35%] h-[35%] bg-blue-600/10 rounded-full blur-[90px]"></div>

  <div
    class="w-full max-w-md glass-effect p-8 md:p-10 shadow-2xl relative z-10 animate-in fade-in zoom-in-95 duration-500">
    <div class="text-center mb-10">
      <div class="inline-block p-3 rounded-2xl bg-purple-600/20 text-purple-400 mb-4 text-2xl">🚀</div>
      <h2 class="text-3xl font-extrabold text-white tracking-tight">Create Account</h2>
      <p class="text-slate-400 mt-2">Join our AI-powered social hub today</p>
    </div>

    <div *ngIf="error"
      class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm animate-in slide-in-from-top-2">
      <div class="flex items-center gap-2">
        <span class="text-lg">⚠️</span>
        {{ error }}
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" #signupForm="ngForm" class="space-y-5">
      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-300 ml-1">Full Name</label>
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-purple-400 transition-colors">👤</span>
          <input type="text" name="username" [(ngModel)]="userData.username" placeholder="John Doe" required
            #username="ngModel"
            class="w-full pl-12 pr-4 py-3.5 bg-slate-900 border border-white/10 rounded-xl focus:border-purple-500/50 focus:ring-4 focus:ring-purple-500/10 transition-all text-white placeholder-slate-600 outline-none">
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-300 ml-1">Email Address</label>
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-purple-400 transition-colors">✉️</span>
          <input type="email" name="email" [(ngModel)]="userData.email" placeholder="name@example.com" required
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" #email="ngModel"
            class="w-full pl-12 pr-4 py-3.5 bg-slate-900 border border-white/10 rounded-xl focus:border-purple-500/50 focus:ring-4 focus:ring-purple-500/10 transition-all text-white placeholder-slate-600 outline-none">
        </div>
        <div *ngIf="email.invalid && email.touched" class="text-xs text-red-400 mt-1 ml-1">
          Valid email is required
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-sm font-semibold text-slate-300 ml-1">Password</label>
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-purple-400 transition-colors">🔒</span>
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="userData.password"
            placeholder="••••••••" required minlength="6" #password="ngModel"
            class="w-full pl-12 pr-12 py-3.5 bg-slate-900 border border-white/10 rounded-xl focus:border-purple-500/50 focus:ring-4 focus:ring-purple-500/10 transition-all text-white placeholder-slate-600 outline-none">
          <button type="button" (click)="showPassword = !showPassword"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition-colors">
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div *ngIf="password.invalid && password.touched" class="text-xs text-red-400 mt-1 ml-1">
          At least 6 characters required
        </div>
      </div>

      <p class="text-[11px] text-slate-500 px-1 italic">
        By continuing, you agree to our <a class="text-purple-500 underline">Terms of Service</a> and <a
          class="text-purple-500 underline">Privacy Policy</a>.
      </p>

      <button type="submit"
        class="w-full btn-modern !py-4 text-lg font-bold shadow-purple-500/20 disabled:grayscale disabled:opacity-50"
        [disabled]="!signupForm.valid || loading">
        <div class="flex items-center justify-center gap-2">
          <span *ngIf="loading"
            class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          {{ loading ? 'Creating Account...' : 'Get Started' }}
        </div>
      </button>
    </form>

    <div class="mt-8 text-center text-slate-400">
      Already have an account?
      <a routerLink="/login"
        class="text-purple-400 font-bold hover:text-purple-300 underline underline-offset-4 decoration-purple-500/30">Sign
        in here</a>
    </div>
  </div>
</div>
