<div class="auth-container">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join our community today</p>

    <div *ngIf="error" class="error-msg">{{ error }}</div>

    <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" [(ngModel)]="userData.username" placeholder="johndoe" required
          #username="ngModel" [class.error]="username.invalid && username.touched">
        <div *ngIf="username.invalid && username.touched" class="field-error">
          Username is required
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="userData.email" placeholder="name@example.com" required
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" #email="ngModel"
          [class.error]="email.invalid && email.touched">
        <div *ngIf="email.invalid && email.touched" class="field-error">
          <span *ngIf="email.errors?.['required']">Email is required</span>
          <span *ngIf="email.errors?.['pattern']">Please enter a valid email address (e.g., .com, .co)</span>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="userData.password"
            placeholder="••••••••" required #password="ngModel" [class.error]="password.invalid && password.touched"
            minlength="6">
          <button type="button" class="password-toggle" (click)="showPassword = !showPassword" tabindex="-1">
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div *ngIf="password.invalid && password.touched" class="field-error">
          <span *ngIf="password.errors?.['required']">Password is required</span>
          <span *ngIf="password.errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="!signupForm.valid || loading">
        {{ loading ? 'Creating account...' : 'Sign Up' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
