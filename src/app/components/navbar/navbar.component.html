<nav
  class="navbar bg-[#0f172a]/80 backdrop-blur-xl border-b border-white/5 sticky top-0 z-50 px-4 md:px-8 h-16 flex items-center justify-between">
  <div class="flex items-center gap-4 w-full max-w-7xl mx-auto">
    <!-- Combined Brand/Toggle Area -->
    <div class="flex items-center gap-4 shrink-0">

      <!-- Premium Enterprise Workspace Toggle (Logged-in only) -->
      <button *ngIf="authService.isLoggedIn()"
        class="relative group/toggle flex items-center justify-center p-2.5 rounded-2xl bg-[#1e293b]/40 border border-white/5 hover:border-purple-500/40 hover:shadow-[0_0_30px_rgba(168,85,247,0.1)] transition-all duration-500 active:scale-95 shadow-lg overflow-hidden shrink-0"
        (click)="toggleMenu()" [title]="uiService.isSidebarCollapsed() ? 'Maximize Workspace' : 'Minimize Sidebar'">

        <!-- Animated Control Icon -->
        <div class="relative w-6 h-6 flex items-center justify-center transition-all duration-700"
          [class.rotate-180]="uiService.isSidebarCollapsed()">
          <div class="flex flex-col gap-1.5 items-start">
            <div class="h-[2px] bg-slate-400 group-hover/toggle:bg-purple-400 rounded-full transition-all duration-300"
              [class.w-4]="!uiService.isSidebarCollapsed()" [class.w-2]="uiService.isSidebarCollapsed()"></div>
            <div class="h-[2px] bg-white group-hover/toggle:bg-white rounded-full transition-all duration-300 w-5">
            </div>
            <div class="h-[2px] bg-slate-500 group-hover/toggle:bg-blue-400 rounded-full transition-all duration-300"
              [class.w-3]="!uiService.isSidebarCollapsed()" [class.w-5]="uiService.isSidebarCollapsed()"></div>
          </div>

          <!-- Directional Indicator (Appears on Hover) -->
          <div
            class="absolute inset-0 flex items-center justify-end opacity-0 group-hover/toggle:opacity-100 transition-all duration-300 translate-x-2 group-hover/toggle:translate-x-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-2.5 h-2.5 text-purple-400" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </div>
        </div>

        <!-- Inner Glow Effect -->
        <div
          class="absolute inset-x-0 bottom-0 h-[1px] bg-gradient-to-r from-transparent via-purple-500/40 to-transparent">
        </div>
        <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none"></div>
      </button>

      <!-- Logo (Only for Guests) -->
      <a routerLink="/" class="flex items-center gap-2 group" *ngIf="!authService.isLoggedIn()">
        <div
          class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-blue-600 flex items-center justify-center text-xl shadow-lg shadow-purple-500/20 group-hover:scale-110 transition-transform">
          ✨</div>
        <span class="text-xl font-bold tracking-tight text-white hidden sm:block">Social <span
            class="text-purple-500">Hub</span></span>
      </a>
    </div>

    <!-- Actions -->
    <div class="ml-auto flex items-center gap-3">
      <ng-container *ngIf="!authService.isLoggedIn(); else loggedInStatus">
        <a routerLink="/login"
          class="hidden sm:block text-sm font-bold text-slate-300 hover:text-purple-400 transition-colors px-4">Login</a>
        <a routerLink="/signup" class="btn-modern !py-2.5 !px-6 text-sm !rounded-xl shadow-lg shadow-purple-500/20">Sign
          Up</a>

        <!-- Enterprise Mobile Toggle (Guest) -->
        <button
          class="md:hidden relative flex items-center justify-center w-10 h-10 ml-2 rounded-xl bg-white/5 border border-white/10 text-slate-300 hover:bg-white/10 active:scale-90 transition-all overflow-hidden group/m-toggle"
          (click)="toggleMenu()">
          <div class="relative w-5 h-5 flex flex-col items-center justify-center gap-1">
            <span class="block w-5 h-0.5 bg-current rounded-full transition-all duration-300"
              [class.rotate-45]="uiService.isSidebarOpen()" [class.translate-y-1.5]="uiService.isSidebarOpen()"></span>
            <span class="block w-5 h-0.5 bg-current rounded-full transition-all duration-300"
              [class.opacity-0]="uiService.isSidebarOpen()"></span>
            <span class="block w-5 h-0.5 bg-current rounded-full transition-all duration-300"
              [class.-rotate-45]="uiService.isSidebarOpen()"
              [class.-translate-y-1.5]="uiService.isSidebarOpen()"></span>
          </div>
          <div
            class="absolute inset-0 bg-gradient-to-tr from-purple-500/0 to-blue-500/0 group-hover/m-toggle:from-purple-500/10 group-hover/m-toggle:to-blue-500/10 transition-all duration-500">
          </div>
        </button>
      </ng-container>

      <ng-template #loggedInStatus>
        <!-- Online Status Indicator -->
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-500/10 border border-green-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
          <span class="text-[10px] font-bold text-green-500 uppercase tracking-widest hidden sm:inline">Active
            Session</span>
        </div>
      </ng-template>
    </div>
  </div>

  <!-- Mobile Menu Overlay for Guests -->
  <div *ngIf="!authService.isLoggedIn() && uiService.isSidebarOpen()"
    class="fixed inset-0 top-16 bg-[#0f172a] z-40 p-6 md:hidden animate-in fade-in slide-in-from-top-4 duration-300">
    <div class="space-y-4">
      <a routerLink="/" (click)="closeMenu()"
        class="block p-4 bg-white/5 border border-white/5 rounded-2xl text-lg font-bold text-white hover:bg-purple-600/20 transition-all">Home</a>
      <a routerLink="/about" (click)="closeMenu()"
        class="block p-4 bg-white/5 border border-white/5 rounded-2xl text-lg font-bold text-white hover:bg-purple-600/20 transition-all">About</a>
      <a routerLink="/login" (click)="closeMenu()"
        class="block p-4 bg-white/5 border border-white/5 rounded-2xl text-lg font-bold text-white hover:bg-purple-600/20 transition-all sm:hidden">Login</a>
    </div>
  </div>
</nav>
